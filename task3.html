<!DOCTYPE html>
<html>
<body>

<h2>Sports Product Review</h2>

<textarea id="review" oninput="countChars()"></textarea>

<p>Characters: <span id="count">0</span></p>

<script>
function countChars() {
    let text = document.getElementById("review").value;
    document.getElementById("count").innerHTML = text.length;
}
</script>

</body>
</html>
